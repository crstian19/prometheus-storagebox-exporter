name: Releaser Pleaser

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - edited
      - labeled

# Prevent concurrent runs to avoid race conditions when PR descriptions are updated
concurrency:
  group: releaser-pleaser
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  releaser-pleaser:
    # Pull request events are only needed for the release PR itself (notes edits,
    # labels). On every other PR the concurrency group cancels the run and the
    # check shows as failed, so skip it there.
    if: github.event_name == 'push' || github.head_ref == 'releaser-pleaser--branches--main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Run Releaser Pleaser
        uses: apricote/releaser-pleaser@v0.9.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          extra-files: |
            Dockerfile
            docker-compose.dev.yml
